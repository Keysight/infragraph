          type: string
          x-field-uid: 2
    Query.SchemaFilter:
      description: |-
        Matches a node by the elements of documents that it references.
        The node matches if, for some reference to a document of the
        schema, the path selects at least one node.
      type: object
      required:
      - schema
      - path
      properties:
        schema:
          description: |-
            The name of an Infrastructure.Schema declared in
            Infrastructure.schemas of the current graph. An unknown schema
            is an error.
          type: string
          x-field-uid: 1
        path:
          description: |-
            MUST be an RFC 9535 JSONPath expression. Despite its name it
            is not a file path, a JSON Pointer or a field name; only
            JSONPath content is accepted. It is evaluated against the element that each
            reference to a document of the schema points to. $ is that
            element, so $ alone matches every node that references a
            document of the schema, $.location
            selects a field if it exists, and a comparison is written with
            the filter expressions and functions of RFC 9535, e.g.
            $[?$.mtu == 9100] or $[?match($.role, 'leaf|spine')]. A filter
            expression selects among the children of the element, so $
            inside it is the element and @ is a child. $[?@.mtu == 9100]
            therefore matches nothing, it tests the mtu of each child
            rather than of the element. A filter on an element that is a
            scalar or an empty object also matches nothing. It MUST
            start with $. A value that is not valid JSONPath, or an empty
            value, is an error. A path with more than 2 descendant
            segments (..) or more than 1024 characters is an error.
          type: string
          x-field-uid: 2
