        - endpoints unset, attribute_filters set: returns edges from the entire graph that match attribute_filters.
        - both set: returns edges matching the expanded endpoints that also match attribute_filters.
        - both unset: returns no results.
        attribute_filters is a single filter shared across every entry in endpoints - it cannot be set differently per endpoints entry. To apply different attribute_filters to different endpoints, use separate edge_filters entries.
