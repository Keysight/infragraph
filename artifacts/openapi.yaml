openapi: 3.0.3
info:
  title: InfraGraph
  description: |-
    ### Overview
    InfraGraph or `infrastructure graph` defines a model-driven, vendor-neutral, standard
    interface for capturing a system of systems suitable for use in co-designing AI/HPC solutions.

    This model allows for defining physical infrastructure as a logical system of systems using graph like terminology.
    In addition to defining a logical graph, an unlimited number of different physical characteristics
    can be associated with logical endpoints.

    ### Graph Terminology
    - an infrastructure `node (vertex)` is the fundamental unit or entity within an infrastructure graph; represented as a endpoint with the following syntax:
      - a combination of a device instance name and a 0 based index and a component name and a 0 based index such as `switch.0.asic.0` and `switch.0.port.0`
    - an infrastructure `edge` is a combination of two `nodes (endpoints)` in a graph such as (`switch.0.asic.0`, `switch.0.port.0`)
    - `path` is a sequence of edges that allows for traversal through the graph such as [`server.0.xpu.0`, `server.0.nic.0`, `switch.0.port.0`, `switch.0.asic.0`]

    ### Contributions
    Contributions to the API and models schema can be made in the following ways:
    - [open an issue](https://github.com/keysight/infragraph/issues) in the models repository
    - [fork the models repository](https://github.com/keysight/infragraph) and submit a PR
  version: 3.1.0
  contact:
    url: https://github.com/keysight/infragraph/issues
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: /
paths:
  /set_graph:
    post:
      tags:
      - Configuration
      operationId: set_graph
      x-stream: client
      description: "Given an infrastructure object this API method will create a fully\
        \ qualified infrastructure graph and validate it.\n\nCreating a fully qualified\
        \ infrastructure graph requires the following steps:\n  - process each of\
        \ the infrastructure instance objects by locating the device and creating\
        \ a subgraph using the device's edges and substituting the instance name for\
        \ the device name.\n  - process each of the infrastructure edges, looking\
        \ up the instance to determine the max count and the name to be substituted\
        \ for the device and link the subgraphs to create a complete infrastructure\
        \ graph \n  - resets all the annotations"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Infrastructure'
      responses:
        '200':
          $ref: '#/components/responses/Success'
          x-field-uid: 1
        default:
          $ref: '#/components/responses/Failure'
          x-field-uid: 2
  /get_graph:
    post:
      tags:
      - Configuration
      operationId: get_graph
      x-stream: client
      description: |-
        This will return the current graph.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphRequest'
      responses:
        '200':
          $ref: '#/components/responses/GraphResponse'
          x-field-uid: 1
        default:
          $ref: '#/components/responses/Failure'
          x-field-uid: 2
  /query_graph:
    post:
      tags:
      - Actions
      operationId: query_graph
      x-stream: client
      description: |-
        Query the current fully expanded graph using a declarative query syntax.

          - example: Ask the graph for specific endpoints such as those of type `XPU` or `NIC`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Query.Request'
      responses:
        '200':
          $ref: '#/components/responses/QueryResponseContent'
          x-field-uid: 1
        default:
          $ref: '#/components/responses/Failure'
          x-field-uid: 2
  /annotate_graph:
    post:
      tags:
      - Configuration
      operationId: annotate_graph
      x-stream: client
      description: |-
        Extend the current graph created by the `set_graph` API.
          - example: Update specific endpoints with name/value information such as `rank=0`
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Annotation'
      responses:
        '200':
          $ref: '#/components/responses/Success'
          x-field-uid: 1
        default:
          $ref: '#/components/responses/Failure'
          x-field-uid: 2
  /capabilities/version:
    get:
      tags:
      - Capabilities
      operationId: get_version
      responses:
        '200':
          description: |-
            Version details from API server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Version'
          x-field-uid: 1
        default:
          $ref: '#/components/responses/Failure'
          x-field-uid: 2
components:
  responses:
    Success:
      description: |-
        The request has succeeded with no application content but the server
        may return a list of detailed warnings.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Warning'
    Failure:
      description: |-
        The request did not succeed and server has responded with error details.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    GraphResponse:
      description: |-
        The current graph content, returned in the representation selected by the request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/GraphResponseContent'
    QueryResponseContent:
      description: |-
        Answer to the query request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Query.Response'
  schemas:
    Infrastructure:
      description: |-
        Represents the overall network infrastructure including devices, links, instances, and edges forming the graph.
      type: object
      properties:
        name:
          description: |-
            The name of the infrastructure.
            Globally unique name of an object. It also serves as the primary key for arrays of objects.
          x-field-uid: 1
          type: string
          pattern: ^[\sa-zA-Z0-9-_()><\[\]]+$
          x-unique: global
        description:
          description: |-
            A detailed description of the infrastructure.
          type: string
          x-field-uid: 2
        devices:
          description: |-
            An inventory of devices and components.
          type: array
          items:
            $ref: '#/components/schemas/Device'
          x-field-uid: 3
        links:
          description: |-
            An inventory of the links present in the infrastructure edges.
          type: array
          items:
            $ref: '#/components/schemas/Link'
          x-field-uid: 4
        instances:
          description: |-
            An inventory of the device instances present in the infrastructure edges.
          type: array
          items:
            $ref: '#/components/schemas/Instance'
          x-field-uid: 5
        edges:
          description: |-
            An array of edge objects used to connect instance devices and components to other instance
            devices and components. These edge objects are used to form a fully qualified qualified graph.
          type: array
          items:
            $ref: '#/components/schemas/Infrastructure.Edge'
          x-field-uid: 6
        schemas:
          description: |-
            An inventory of schemas that annotations can reference.
            A document of a schema is annotated once at graph level, and
            nodes reference elements of it. A schema MUST be declared here
            before an annotation or a query can name it.
          type: array
          items:
            $ref: '#/components/schemas/Infrastructure.Schema'
          x-status:
            status: under_review
            information: Schema annotations are a proposal under review
          x-field-uid: 7
    Infrastructure.Schema:
      description: |-
        A schema with a namespace used to validate opaque serialized documents.
        The choice selects the validator that is used.
      type: object
      required:
      - namespace
      - choice
      properties:
        namespace:
          description: |-
            Globally unique namespace of the schema. Annotated documents and
            schema filters name the schema with it.
            Including a version in the namespace is recommended, e.g. fabricgym.switch.v1
          type: string
          pattern: ^[a-zA-Z0-9._/-]+$
          x-unique: global
          x-field-uid: 1
        choice:
          description: |-
            The schema language, which determines the validator.
            In every case an annotated document MUST be JSON or YAML.
            - jsonschema: the decoded document is validated against a JSON Schema.
            - openapi: the decoded document is validated against a schema
              object in an OpenAPI 3.0 or 3.1 document.
          type: string
          x-field-uid: 2
          x-enum:
            jsonschema:
              x-field-uid: 1
            openapi:
              x-field-uid: 2
          enum:
          - jsonschema
          - openapi
        jsonschema:
          description: |-
            A JSON Schema definition.
          $ref: '#/components/schemas/Infrastructure.Schema.JsonSchema'
          x-field-uid: 3
        openapi:
          description: |-
            An OpenAPI document definition.
          $ref: '#/components/schemas/Infrastructure.Schema.OpenApi'
          x-field-uid: 4
    Infrastructure.Schema.JsonSchema:
      description: |-
        A JSON Schema used to validate a document.
        The root of the document is the root of the schema.
      type: object
      required:
      - definition
      properties:
        definition:
          description: |-
            The JSON Schema document as a JSON or YAML string.
            Only a local $ref, one that starts with #, is supported. A
            remote $ref is an error when set_graph compiles the schema, and
            no remote document is fetched.
            Patterns are evaluated with RE2, so a pattern that uses
            lookahead or a backreference is an error. A schema that
            combines unevaluatedProperties with patternProperties is an
            error. The size of the definition is bounded.
            Without a $schema keyword, the validator uses JSON Schema
            draft 2020-12.
          type: string
          x-field-uid: 1
    Infrastructure.Schema.OpenApi:
      description: |-
        A complete OpenAPI 3.0 or 3.1 document used to validate an annotated document.
        The document conforms to the schema object named by root.
      type: object
      required:
      - definition
      - root
      properties:
        definition:
          description: |-
            The full OpenAPI document as a JSON or YAML string.
            The document MUST be bundled: every $ref MUST resolve within
            the document, and no external files are fetched. Tool-specific
            extensions such as openapiart's x-include are not processed,
            so an openapiart model MUST be supplied in its bundled form.
            Vendor extension keywords (x-...) are ignored. An unknown
            format is ignored and does not fail validation. A $ref of the
            form #/components/schemas/... is resolved against this
            document, also when validating against the root object.
            Patterns are evaluated with RE2, so a pattern that uses
            lookahead or a backreference is an error.
          type: string
          x-field-uid: 1
        root:
          description: |-
            The name of the schema object under components/schemas that
            the document as a whole conforms to, written exactly as the
            component is named, e.g. Config
          type: string
          x-field-uid: 2
    Device:
      description: |-
        A subgraph container for a device and its components, links and edges.
        The edges form a subgraph of the device.
      type: object
      required:
      - name
      - components
      - links
      - edges
      properties:
        name:
          description: |-
            The name of the device being described.
            Globally unique name of an object. It also serves as the primary key for arrays of objects.
          x-field-uid: 1
          type: string
          pattern: ^[\sa-zA-Z0-9-_()><\[\]]+$
          x-unique: global
        description:
          description: |-
            A description of the device.
            This will not be used in Infrastructure.connections.
          type: string
          x-field-uid: 2
        components:
          description: |-
            Array of device components
          type: array
          items:
            $ref: '#/components/schemas/Component'
          x-field-uid: 3
        links:
          description: |-
            All the links that make up this device.
          type: array
          items:
            $ref: '#/components/schemas/Link'
          x-field-uid: 4
        edges:
          description: |-
            An array of edges that are used to produce a device graph.
            These are used to connect components to each other or components
            to other device components (composability).
            The generated graph edges will be fully qualified using the count property
            of the device and component and slice notation of each endpoint in the edge object.
          type: array
          items:
            $ref: '#/components/schemas/Device.Edge'
          x-field-uid: 5
    Component.Custom:
      description: |-
        Placeholder for a component that can be extended.
      type: object
      required:
      - type
      properties:
        type:
          description: |-
            This property will be added to the graph node in the form of a `type = value` attribute.
          type: string
          x-field-uid: 1
    Component.Device:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component.Cpu:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component.Xpu:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component.Nic:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component.Memory:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component.Port:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component.Switch:
      description: |-
        Placeholder for a component that can be extended.
      type: object
    Component:
      description: |-
        A container for describing a component.
        A Component is contained in a Device.
      type: object
      required:
      - name
      - count
      - choice
      properties:
        name:
          x-field-uid: 1
          description: |-
            Globally unique name of an object. It also serves as the primary key for arrays of objects.
          type: string
          pattern: ^[\sa-zA-Z0-9-_()><\[\]]+$
          x-unique: global
        description:
          description: |-
            A description of the component.
          type: string
          x-field-uid: 2
        count:
          description: |-
            The maxiumim number of this component that will be contained by a single device instance.
            This property is used by the infragraph service in edge generation.
          type: integer
          format: int32
          x-field-uid: 3
        choice:
          description: |-
            The type of component.

            The `choice` value will be added to the graph node in the form of a `type = value` attribute.

            - `custom` If the type of a component is not listed as a choice it can be defined using the custom object which includes a type property that allows for a custom type attribute on the graph node.
            - `device` This enum allows a device to be composed of other devices.
              - When this enum is selected the name of the component MUST be the name of a device that exists in the Infrastructure.devices array.
              - The `device name` will be used to lookup the value of the `instance name` which MUST be combined  with the `component name` to produce a unique name when producing graph nodes.
            - `cpu` A high level definition for a cpu
            - `xpu` A high level definition for a neural processing unit
            - `nic` A high level definition for a network interface card, for more detailed breakdowns create a device representing a specific type network interface card
            - `memory` A high level definition for memory
            - `port` A high level definitiion for an IO port
            - `switch` A high level definition for an internal switch connecting components
          type: string
          x-field-uid: 4
          x-enum:
            custom:
              x-field-uid: 1
            device:
              x-field-uid: 2
            cpu:
              x-field-uid: 3
            xpu:
              x-field-uid: 4
            nic:
              x-field-uid: 5
            memory:
              x-field-uid: 6
            port:
              x-field-uid: 7
            switch:
              x-field-uid: 8
          enum:
          - custom
          - device
          - cpu
          - xpu
          - nic
          - memory
          - port
          - switch
        custom:
          $ref: '#/components/schemas/Component.Custom'
          x-field-uid: 10
        device:
          $ref: '#/components/schemas/Component.Device'
          x-field-uid: 11
        cpu:
          $ref: '#/components/schemas/Component.Cpu'
          x-field-uid: 12
        xpu:
          $ref: '#/components/schemas/Component.Xpu'
          x-field-uid: 13
        nic:
          $ref: '#/components/schemas/Component.Nic'
          x-field-uid: 14
        memory:
          $ref: '#/components/schemas/Component.Memory'
          x-field-uid: 15
        port:
          $ref: '#/components/schemas/Component.Port'
          x-field-uid: 16
        switch:
          $ref: '#/components/schemas/Component.Switch'
          x-field-uid: 17
    Link.Physical.Bandwidth:
      description: |-
        A container for specific Link physical Properties.
      type: object
      properties:
        choice:
          description: |-
            Choice of bandwidth unit between gigabits_per_second (Gbps), gigabytes_per_second (GBps), or gigatransfers_per_second (GT/s).
          type: string
          x-field-uid: 1
          x-enum:
            gigabits_per_second:
              x-field-uid: 1
            gigabytes_per_second:
              x-field-uid: 2
            gigatransfers_per_second:
              x-field-uid: 3
          enum:
          - gigabits_per_second
          - gigabytes_per_second
          - gigatransfers_per_second
        gigabits_per_second:
          description: |-
            Gigabits per second.
          type: number
          x-field-uid: 2
        gigabytes_per_second:
          description: |-
            Gigabytes per second.
          type: number
          x-field-uid: 3
        gigatransfers_per_second:
          description: |-
            Gigatrasfers per second.
          type: number
          x-field-uid: 4
    Link.Physical.Latency:
      description: |-
        A container for specific Link latency properties.
      type: object
      properties:
        choice:
          description: |-
            Choice of latecy unit between ms (milliseconds), ns(nanoseconds) and us(microseconds).
          type: string
          x-field-uid: 1
          x-enum:
            ms:
              x-field-uid: 1
            us:
              x-field-uid: 2
            ns:
              x-field-uid: 3
          enum:
          - ms
          - us
          - ns
        ms:
          description: |-
            Latency in milliseconds
          type: number
          x-field-uid: 2
        us:
          description: |-
            Latency in microseconds.
          type: number
          x-field-uid: 3
        ns:
          description: |-
            Latency in nanoseconds.
          type: number
          x-field-uid: 4
    Link.Physical:
      description: |-
        Defines the physical properties of a network link, including bandwidth and latency characteristics.
      type: object
      properties:
        bandwidth:
          description: |-
            Specifies the bandwidth capacity of the physical link.
          $ref: '#/components/schemas/Link.Physical.Bandwidth'
          x-field-uid: 1
        latency:
          description: |-
            Specifies the latency characteristics of the physical link.
          $ref: '#/components/schemas/Link.Physical.Latency'
          x-field-uid: 2
    Link:
      description: |-
        A container for describing a link used between components.
      type: object
      required:
      - name
      properties:
        name:
          x-field-uid: 1
          description: |-
            Globally unique name of an object. It also serves as the primary key for arrays of objects.
          type: string
          pattern: ^[\sa-zA-Z0-9-_()><\[\]]+$
          x-unique: global
        description:
          description: |-
            A description of the type of link.
          type: string
          x-field-uid: 2
        physical:
          description: |-
            A container for physical properties.
          $ref: '#/components/schemas/Link.Physical'
          x-field-uid: 3
    Device.Endpoint:
      description: |-
        Describes an endpoint consisting of a device and its component, including optional device name and component slice.
      type: object
      required:
      - component
      properties:
        device:
          description: |-
            This property is optional and should only be used when device composition is required.
            - Device composition occurs when a device includes a component whose choice property is set to device
            - This property value MUST match a Device.name in an item in the Infrastructure.devices array
            - The Device.name value MUST match an Instance.device value in the Infrastructure.instances array
            - This property value MUST be combined with the component name to generate a unique endpoint
          type: string
          x-field-uid: 1
        component:
          description: |-
            The name of a component that exists in the containing device
            and the indexes of the component.

            The indexes MUST be specified using python slice notation.
              - example: cx5[0:2]
          type: string
          x-field-uid: 2
    Infrastructure.Endpoint:
      description: |-
        Defines an endpoint referencing an infrastructure instance and its component with slice indexing.
      type: object
      required:
      - instance
      - component
      properties:
        instance:
          description: |-
            A name that matches the Instance.name property of an instance object that MUST exist in the infrastructure instances array.

            The instance object yields:
              - a device name that contains the component and MUST exist in the infrastructure devices
              - a count that is the maximum to be used in the slice notation

            The indexes MUST be specified using python slice notation.
              - example: host[0:2]
          type: string
          x-field-uid: 1
        component:
          description: |-
            The name of a component that MUST exist in the Instance.device specified by the instance object in the Infrastructure.instances array.

            The indexes MUST be specified using python slice notation. Some examples are:
              - xpu[0:2]
              - dgx.cx5[0]
          type: string
          x-field-uid: 2
    Infrastructure.Edge:
      description: |-
        Represents an edge between two infrastructure endpoints with an associated link and edge scheme.
      type: object
      required:
      - ep1
      - ep2
      - link
      properties:
        ep1:
          description: |-
            A device and component that is one endpoint of the edge
          $ref: '#/components/schemas/Infrastructure.Endpoint'
          x-field-uid: 1
        ep2:
          description: |-
            A device and component that is the other endpoint of the edge
          required:
          - device
          - component
          $ref: '#/components/schemas/Infrastructure.Endpoint'
          x-field-uid: 2
        scheme:
          x-field-uid: 3
          description: |-
            The scheme that will be used to create edges between the endpoints ep1 and ep2.
          type: string
          x-enum:
            one2one:
              x-field-uid: 1
            many2many:
              x-field-uid: 2
            ring:
              x-field-uid: 3
          enum:
          - one2one
          - many2many
          - ring
        link:
          description: |-
            The name of a link that defines additional characteristics of the edge.
            The name MUST exist in the links array of the infrastructure.
          type: string
          x-field-uid: 4
    Device.Edge:
      description: |-
        Represents an edge connecting two device endpoints, describing the link and edge scheme.
      type: object
      required:
      - ep1
      - ep2
      - link
      properties:
        ep1:
          description: |-
            An optional device and component that is the other endpoint of the edge
          $ref: '#/components/schemas/Device.Endpoint'
          x-field-uid: 1
        ep2:
          description: |-
            An optional device and component that is the other endpoint of the edge
          $ref: '#/components/schemas/Device.Endpoint'
          x-field-uid: 2
        scheme:
          x-field-uid: 3
          description: |-
            The scheme that will be used to create edges between the endpoints ep1 and ep2.
          type: string
          x-enum:
            one2one:
              x-field-uid: 1
            many2many:
              x-field-uid: 2
            ring:
              x-field-uid: 3
          enum:
          - one2one
          - many2many
          - ring
        link:
          description: |-
            The name of a link that defines additional characteristics of the edge.
            The name MUST exist in the links array of the containing device.
          type: string
          x-field-uid: 4
    Instance:
      description: |-
        Defines an instance alias referring to a device and specifying how many copies (count) exist for graph modeling.
      type: object
      required:
      - name
      - device
      - count
      properties:
        name:
          description: |-
            An alias for the device that MUST be used in the Infrastructure edge object.
            Globally unique name of an object. It also serves as the primary key for arrays of objects.
          x-field-uid: 1
          type: string
          pattern: ^[\sa-zA-Z0-9-_()><\[\]]+$
          x-unique: global
        description:
          description: |-
            A description of the instance.
          type: string
          x-field-uid: 2
        device:
          description: |-
            The name of a device that MUST exist in the array of Infrastructure devices.
          type: string
          x-field-uid: 3
        count:
          description: |-
            The maximum number of instances that will be created as nodes in the graph.

            Not all the instances need to be used in the graph edges.
          type: integer
          format: int32
          x-field-uid: 4
    Error:
      description: |-
        Error response generated while serving API request.
      type: object
      required:
      - code
      - errors
      properties:
        code:
          description: |-
            Numeric status code based on the underlying transport being used.
            The API server MUST set this code explicitly based on following references:
              - HTTP 4xx errors: https://datatracker.ietf.org/doc/html/rfc9110#section-15.5
              - HTTP 5xx errors: https://datatracker.ietf.org/doc/html/rfc9110#section-15.6
              - gRPC errors: https://grpc.github.io/grpc/core/md_doc_statuscodes.html
          type: integer
          format: int32
          x-field-uid: 1
        kind:
          description: |-
            Classification of error originating from within API server that may not be mapped to the value in `code`.
            Absence of this field may indicate that the error did not originate from within API server.
          type: string
          x-enum:
            validation:
              x-field-uid: 1
            internal:
              x-field-uid: 2
          x-field-uid: 2
          enum:
          - validation
          - internal
        errors:
          description: |-
            List of error messages generated while executing the request.
          type: array
          items:
            type: string
          x-field-uid: 3
    Warning:
      description: |-
