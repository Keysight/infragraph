          $ref: '#/components/schemas/Query.Response.ShortestPath'
          x-field-uid: 3
    Query.Request.Node:
      description: |-
        Defines request for node match. node_identifiers, attribute_filters and schema_filters are all optional, but at least one MUST be set or the filter returns no results:
        - node_identifiers set, no filters set: returns all nodes matching the expanded node_identifiers, with all of their attributes.
        - node_identifiers unset, filters set: returns nodes from the entire graph that match every filter that is set.
        - node_identifiers and filters set: returns nodes matching the expanded node_identifiers that also match every filter that is set.
        - all unset: returns no results.
        attribute_filters and schema_filters are shared across every entry in node_identifiers - they cannot be set differently per node_identifiers entry. To apply different filters to different node identifiers, use separate node_filters entries.
      type: object
      required:
      - name
      properties:
        name:
          description: |-
            Name of this node_filter, used to identify its matched nodes in the response.
          type: string
          x-field-uid: 3
        node_identifiers:
          description: |-
            Node names that MUST exist or match nodes present in the graph. This supports slicing operator and expands to the fully qualified graph format:
            - server[0]xpu[0]
            - server[0:2]
            - switch
            If omitted, the filter considers every node in the graph, provided attribute_filters or schema_filters is set; if all three are omitted, the filter returns no results.
          type: array
          items:
            type: string
          x-field-uid: 1
        attribute_filters:
          description: |-
            Attribute-based filter criteria, applied identically to every node matched via node_identifiers (or to every node in the graph if node_identifiers is omitted). It is not possible to apply a different attribute_filters to different node_identifiers within the same node_filter; use a separate node_filters entry for that. If omitted, matched nodes are returned with all of their attributes and no attribute-based narrowing is applied.
          $ref: '#/components/schemas/Query.Request.Attribute'
          x-field-uid: 2
        schema_filters:
          description: |-
            Filters on the elements of documents that nodes reference.
            If node_identifiers is set, the filters are evaluated only
            against those nodes. Otherwise they are evaluated against every
            node that references a document of the schema. A node with no
            reference to a document of the schema never matches. Every schema filter MUST hold, and
            when attribute_filters is also set, a node matches only if both
            hold. If node_identifiers, attribute_filters and schema_filters
            are all unset, the filter returns no results.
          type: array
          items:
            $ref: '#/components/schemas/Query.SchemaFilter'
          x-status:
            status: under_review
            information: Schema annotations are a proposal under review
          x-field-uid: 4
    Query.Request.Edge:
      description: |-
