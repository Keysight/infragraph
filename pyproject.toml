[project]
name = "infragraph"
description = "Infrastructure as a Graph"
requires-python = ">=3.10"
dependencies = [
    "networkx",
    "semantic_version",
    "pyyaml",
    "requests",
    "grpcio",
    "protobuf",
    "typer",
]
authors = [
    {name = "TBD", email = "tbd@infragraph.org"}
]
license = {text = "MIT"}
readme = "README.md"
keywords = ["infrastructure", "graph", "chakra", "astrasim"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dynamic = ["version"]

[project.optional-dependencies]
schemas = [
    "ruamel.yaml>=0.18",
    "jsonschema>=4.18,<5",
    "referencing>=0.30,<1",
    "openapi-schema-validator>=0.6,<1",
    "jsonpath-rfc9535>=1.0,<3",
    "iregexp-check>=0.1",
    "google-re2>=1.1",
]

[project.urls]
"Homepage" = "https://infragraph.dev/"
"Repository" = "https://github.com/Keysight/infragraph"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path="schema/info.yaml"
pattern="version:\\s*(?P<version>(0|[1-9]\\d*)\\.(0|[1-9]\\d*)\\.(0|[1-9]\\d*)(?:-[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?(?:\\+[0-9A-Za-z-]+(\\.[0-9A-Za-z-]+)*)?)"

[tool.hatch.build.sources]
"artifacts/infragraph" = "infragraph"
"src/infragraph" = "infragraph"
"src/tests" = "infragraph/tests"
"src/docs" = "infragraph/docs"
"src/infragraph/blueprints/fabrics" = "infragraph/blueprints/fabrics"
"src/infragraph/blueprints/devices" = "infragraph/blueprints/devices"

[tool.hatch.build.targets.sdist]
exclude = [
    "**/*",
    "!pyproject.toml",
    "!README.md",
    "!src/**/*.py",
    "!src/**/*.proto",
    "!src/docs/*.*",
    "!src/infragraph/visualizer/*.*",
]

[tool.hatch.build]
artifacts = [
    "src/infragraph/visualizer/frontend/**/*",
]

[tool.hatch.build.targets.wheel.sources]
"src/**" = "infragraph"

[project.scripts]
infragraph = "infragraph.__main__:app"
